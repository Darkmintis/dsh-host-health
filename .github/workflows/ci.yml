name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node 24, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (JSDoc + checkJs)
        run: npm run typecheck

      - name: Lint (syntax + forbidden patterns)
        run: npm run lint

      - name: Test (node:test, fixtures only)
        run: npm test

      - name: Build readiness checks
        run: npm run build
